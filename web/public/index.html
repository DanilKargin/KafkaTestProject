<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Order Tracker — практика</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="logo">🧾 Order<span>Tracker</span></div>
      <nav class="nav">
        <a href="index.html" class="active">⚡ Демонстрация</a>
        <a href="diagram.html">📐 Схема Outbox</a>
      </nav>
    </div>
  </header>

  <div class="wrap">
    <h1>Практическая демонстрация</h1>
    <div class="sub">Создай заказ и проследи его путь: <code>orders</code> → <code>outbox</code> → Kafka → <code>inbox</code></div>

    <div class="card">
      <h3>Создать заказ</h3>
      <div class="create-form">
        <div>
          <label>Сумма</label>
          <input id="amount" type="number" value="199.99" step="0.01" />
        </div>
        <button id="createBtn">Создать заказ</button>
      </div>
      <div id="createdInfo" style="margin-top:12px;font-size:13px;color:var(--text-dim);"></div>
    </div>

    <div class="card" id="pipelineCard" style="display:none;">
      <h3>Путь заказа</h3>
      <div class="order-id-label">Order ID: <code id="orderIdLabel"></code></div>

      <div class="pipeline">
        <div class="stage" id="stage-db">
          <div class="stage-title">1. БД (orders)</div>
          <div class="stage-status">—</div>
          <div class="stage-meta" id="meta-db"></div>
        </div>
        <div class="stage" id="stage-outbox">
          <div class="stage-title">2. Outbox</div>
          <div class="stage-status">—</div>
          <div class="stage-meta" id="meta-outbox"></div>
        </div>
        <div class="stage" id="stage-kafka">
          <div class="stage-title">3. Kafka</div>
          <div class="stage-status">—</div>
          <div class="stage-meta" id="meta-kafka"></div>
        </div>
        <div class="stage" id="stage-inbox">
          <div class="stage-title">4. Inbox</div>
          <div class="stage-status">—</div>
          <div class="stage-meta" id="meta-inbox"></div>
        </div>
      </div>
    </div>

    <div class="card">
      <h3>Последние заказы</h3>
      <table>
        <thead>
          <tr><th>ID</th><th>Сумма</th><th>Статус</th><th>Создан</th></tr>
        </thead>
        <tbody id="ordersBody"></tbody>
      </table>
    </div>

    <div class="card">
      <h3>Лог</h3>
      <div class="log" id="log"></div>
    </div>
  </div>

<script>
const $ = (id) => document.getElementById(id);
let currentOrderId = null;
let pollTimer = null;

function log(msg) {
  const el = $("log");
  const ts = new Date().toLocaleTimeString();
  el.textContent += `[${ts}] ${msg}\n`;
  el.scrollTop = el.scrollHeight;
}

async function createOrder() {
  const amount = parseFloat($("amount").value);
  if (!amount || amount <= 0) return alert("Укажите корректную сумму");

  $("createBtn").disabled = true;
  log(`Создаю заказ на сумму ${amount}...`);
  try {
    const r = await fetch("/api/orders", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ amount }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || "Ошибка");

    currentOrderId = data.orderId;
    $("orderIdLabel").textContent = data.orderId;
    $("pipelineCard").style.display = "block";
    $("createdInfo").textContent = `Заказ ${data.orderId} создан`;
    log(`Заказ создан: ${data.orderId}, event: ${data.eventId}`);
    startPolling();
  } catch (e) {
    log(`ОШИБКА: ${e.message}`);
    alert(e.message);
  } finally {
    $("createBtn").disabled = false;
  }
}

function setStage(stageId, state, statusText, metaText) {
  const el = $(stageId);
  el.classList.remove("done", "active", "pending");
  el.classList.add(state);
  el.querySelector(".stage-status").textContent = statusText;
  $(`meta-${stageId.replace("stage-", "")}`).textContent = metaText || "";
}

async function refreshStatus() {
  if (!currentOrderId) return;
  try {
    const r = await fetch(`/api/orders/${currentOrderId}`);
    if (!r.ok) return;
    const { order, outbox, inbox } = await r.json();

    if (order) {
      setStage("stage-db", "done", `✓ ${order.status}`,
        `id=${order.id.slice(0,8)}… amount=${order.amount}`);
    }
    if (outbox) {
      const isPublished = outbox.status === "PUBLISHED";
      setStage("stage-outbox", isPublished ? "done" : "active",
        isPublished ? "✓ PUBLISHED" : "⏳ PENDING",
        `id=${outbox.id} created=${new Date(outbox.created_at).toLocaleTimeString()}`);
    } else {
      setStage("stage-outbox", "pending", "—", "нет записи");
    }
    if (outbox && outbox.status === "PUBLISHED") {
      setStage("stage-kafka", "done", "✓ Отправлено",
        `published_at=${new Date(outbox.published_at).toLocaleTimeString()}`);
    } else if (outbox) {
      setStage("stage-kafka", "pending", "—", "ждём relay");
    } else {
      setStage("stage-kafka", "pending", "—", "");
    }
    if (inbox) {
      setStage("stage-inbox", "done", "✓ Обработано",
        `key=${inbox.message_key.slice(0,8)}… processed=${new Date(inbox.processed_at).toLocaleTimeString()}`);
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; log("Заказ полностью обработан ✓"); }
    } else if (outbox && outbox.status === "PUBLISHED") {
      setStage("stage-inbox", "active", "⏳ Ждём consumer", "");
    } else {
      setStage("stage-inbox", "pending", "—", "");
    }
  } catch (e) {
    log(`Ошибка обновления: ${e.message}`);
  }
}

function startPolling() {
  if (pollTimer) clearInterval(pollTimer);
  refreshStatus();
  pollTimer = setInterval(refreshStatus, 1500);
}

async function loadOrders() {
  try {
    const r = await fetch("/api/orders");
    const rows = await r.json();
    $("ordersBody").innerHTML = rows.map(o => `
      <tr onclick="selectOrder('${o.id}')">
        <td><code>${o.id.slice(0,8)}…</code></td>
        <td>${o.amount}</td>
        <td>${o.status}</td>
        <td>${new Date(o.created_at).toLocaleString()}</td>
      </tr>
    `).join("") || `<tr><td colspan="4" style="color:var(--text-muted);">Пока нет заказов</td></tr>`;
  } catch (e) { console.error(e); }
}

window.selectOrder = (id) => {
  currentOrderId = id;
  $("orderIdLabel").textContent = id;
  $("pipelineCard").style.display = "block";
  startPolling();
};

$("createBtn").addEventListener("click", createOrder);
loadOrders();
setInterval(loadOrders, 5000);
</script>
</body>
</html>
